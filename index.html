<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoFap Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>🔥 Streak Tracker</h1>
    <div class="days" id="daysCount">0</div>
    <p>Days Clean</p>
    
    <div class="stats">
      <p>Points: <b id="userPoints">0</b></p>
      <p>Rank: <b id="userRank">Bronze</b></p>
    </div>

    <button onclick="resetStreak()" class="reset-btn">Reset (Relapsed)</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
